name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        run: |
          brew update
          brew --version

      # Homebrew only loads formulae from taps, so tap this checkout under its published name.
      - name: Tap this checkout
        run: brew tap moneytool/tap "$GITHUB_WORKSPACE"

      - name: Style
        run: brew style moneytool/tap/ecsodus

      - name: Audit
        run: brew audit --strict --online moneytool/tap/ecsodus

      - name: Install from source
        run: brew install --build-from-source --verbose moneytool/tap/ecsodus

      - name: Test
        run: brew test --verbose moneytool/tap/ecsodus
